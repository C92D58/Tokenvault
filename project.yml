# Xcode project for the **signed** macOS build.
#
# Why this exists: `build.sh` compiles with swiftc and signs ad-hoc, which cannot carry the
# `com.apple.developer.icloud-*` entitlements (AMFI kills such a binary at launch). iCloud Drive
# sync needs a real profile, i.e. a real target with automatic signing. The sources are the same
# files build.sh compiles — nothing is duplicated.
#
#   xcodegen generate                       # writes TokenVault.xcodeproj
#   xcodebuild -project TokenVault.xcodeproj -scheme TokenVault \
#     -configuration Debug -allowProvisioningUpdates build
#
# `build.sh` stays the zero-dependency local path (no signing, iCloud reported unavailable).
name: TokenVault
options:
  bundleIdPrefix: dev.wahsun
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: MAA6W8AG5P
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  TokenVault:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wahsun.tokenvault
        PRODUCT_NAME: TokenVault
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TokenVault.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
